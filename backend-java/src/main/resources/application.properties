# Load Gmail credentials: put application-local.properties in backend-java folder (or project root)
# When you run from backend-java, ../ = project root. Try parent first so root file is found.
spring.config.import=optional:file:../application-local.properties,optional:file:./application-local.properties

# dev = application-dev.properties | prod = application-prod.properties (set SPRING_PROFILES_ACTIVE on Render)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server (Render and other hosts set PORT)
server.port=${PORT:5000}

# MongoDB (same DB as Node backend - can share data)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gift-mart}
# Unique indexes on @Indexed fields (e.g. Order.stripePaymentIntentId) — set false only if you manage indexes in Atlas
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-change-in-production-make-it-long-enough}
jwt.expiration=${JWT_EXPIRES_IN:7d}

# Frontend (CORS)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Error reporting
server.error.include-message=always
server.error.include-stacktrace=always

# File upload (for product images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Mail (Gmail) - for sending newsletter verification code to real emails
# 1. Turn on 2-Step Verification: https://myaccount.google.com/security
# 2. Create App Password: https://myaccount.google.com/apppasswords (choose "Mail") - use that 16-char password, NOT your Gmail password
# 3. Set below in application-local.properties (in backend-java folder) OR use run-with-mail.ps1
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Debug: set to true to see full SMTP error in console when send fails
logging.level.org.springframework.mail=DEBUG
# Sender address (usually same as username)
app.newsletter.from=${SPRING_MAIL_USERNAME:}

# Stripe (card checkout). Secret key from Dashboard → Developers → API keys.
stripe.secret.key=${STRIPE_SECRET_KEY:}
# Many countries (incl. typical Sri Lanka merchant accounts) cannot charge LKR on Stripe.
# Default: charge in USD; cart stays in LKR and we convert using stripe.lkr-per-usd (LKR per 1 USD).
stripe.charge.currency=${STRIPE_CHARGE_CURRENCY:usd}
stripe.lkr-per-usd=${STRIPE_LKR_PER_USD:320}

# Dispatch hub (Jaffna) — distances and map default
giftmart.origin.lat=9.6615
giftmart.origin.lng=80.0255

# Google Maps: Distance Matrix + Geocoding (server). Optional if customers always use map/live location (Haversine fallback for coords-only).
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# When Distance Matrix fails (quota, network, no route): use fixed km for shipping tiers (0 = use Haversine instead).
# Or set matrix-failure-flat-lkr > 0 for a fixed LKR shipping charge (takes precedence over distance-matrix-fallback-km).
giftmart.shipping.distance-matrix-fallback-km=0
giftmart.shipping.matrix-failure-flat-lkr=0

# How often to advance simulated delivery stages (ms)
giftmart.delivery.poll-ms=60000
